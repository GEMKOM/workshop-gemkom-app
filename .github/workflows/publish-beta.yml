# Publishes the React app (web/) at saha.gemcore.com.tr/beta/ during the pilot.
#
# GitHub Pages serves main as it is (Settings -> Pages: deploy from branch
# main, root), so after a change to web/ lands on main this builds the app and
# commits the build to main: app-assets/ (the files) and beta/ (the pages), via
# web/scripts/publish.mjs. That commit is an ordinary push, so Pages publishes
# it the usual way. The legacy pages are never touched. Don't edit app-assets/
# or beta/ by hand.

name: Publish beta

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publish-beta.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two builds never push over each other.
concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the app for /beta/
        working-directory: web
        env:
          VITE_BASENAME: /beta
        run: |
          npm ci
          npm run build

      - name: Write the build into the repository
        working-directory: web
        run: node scripts/publish.mjs --prefix /beta

      - name: Commit it to main
        run: |
          git add -A app-assets beta
          if git diff --cached --quiet; then
            echo "The published build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish the /beta/ build of ${GITHUB_SHA::7}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          git log --oneline -1

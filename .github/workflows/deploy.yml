# Deploys saha.gemcore.com.tr to GitHub Pages.
#
# The site is the React app (web/): its build under /app-assets/ and its entry
# page at every route (/, /machining/, /cnc_cutting/tasks/, ..., and 404.html),
# written by web/scripts/assemble.mjs over the legacy files (every tracked file
# except .github/ and web/, plus .nojekyll). The legacy scripts stay, so a
# phone that still has a legacy page open keeps working until it reloads (the
# warehouse pages were removed at the cutover). Recent deploys' asset files stay
# published so a phone that opened the app before a deploy keeps working
# (web/scripts/keep-old-assets.mjs).
#
# Rollback to the legacy pages: revert the cutover PR; the deploy that follows
# serves them again, with the React app back at /beta/.
#
# Settings -> Pages -> Source is "GitHub Actions" (since 2026-11-24).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the legacy site
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zv -e '^\.github/' -e '^web/' \
            | xargs -0 cp --parents -t _site
          touch _site/.nojekyll

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the React app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Add the React app to the site
        working-directory: web
        run: node scripts/assemble.mjs --site ../_site

      # Every page operators open must be the React app, with the custom domain.
      - name: Check the site
        run: |
          test "$(cat _site/CNAME)" = "saha.gemcore.com.tr"
          for page in index.html 404.html login/index.html login/reset-password/index.html \
                      machining/index.html machining/tasks/index.html \
                      cnc_cutting/index.html cnc_cutting/tasks/index.html welding/timesheet/index.html \
                      maintenance/index.html maintenance/faults/task/index.html \
                      department-requests/index.html department-requests/create/index.html; do
            grep -q '/app-assets/' "_site/$page" || { echo "$page is not the React app"; exit 1; }
          done
          # The legacy scripts stay for a phone that still has a legacy page open.
          test -s _site/authService.js
          test -s _site/machining/tasks/taskLogic.js
          test ! -e _site/warehouse
          test ! -e _site/beta
          test ! -e _site/web
          echo "files: $(find _site -type f | wc -l)"

      # Recent deploys' asset files stay published (see web/scripts/keep-old-assets.mjs).
      - name: Restore earlier deploys' assets
        uses: actions/cache/restore@v4
        with:
          path: .asset-history
          key: app-assets-history-${{ github.run_id }}
          restore-keys: app-assets-history-
      - name: Keep recent asset files
        working-directory: web
        run: node scripts/keep-old-assets.mjs --site ../_site --history ../.asset-history --days 14 --live https://saha.gemcore.com.tr
      - name: Save the assets history
        uses: actions/cache/save@v4
        with:
          path: .asset-history
          key: app-assets-history-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

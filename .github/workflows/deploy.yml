# Deploys saha.gemcore.com.tr to GitHub Pages.
#
# The site is the legacy pages exactly as they were served from the branch
# (every tracked file except .github/ and web/, plus .nojekyll), and, during
# the pilot (web/docs/parity.md, phase 3), the React app at /beta/ next to them:
# its build under /app-assets/ and its entry page at /beta/ and every route
# under it (web/scripts/assemble.mjs). Recent deploys' asset files stay
# published so a phone that opened the app before a deploy keeps working
# (web/scripts/keep-old-assets.mjs).
#
# REQUIRES: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Until it is switched, the branch deploy (main, repo root) keeps serving the
# legacy site and the deployments below are not what visitors get. After
# switching, run this workflow once (Actions -> Deploy -> Run workflow) and
# check that the custom domain (saha.gemcore.com.tr) is still set.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the legacy site
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zv -e '^\.github/' -e '^web/' \
            | xargs -0 cp --parents -t _site
          touch _site/.nojekyll

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the React app for /beta/
        working-directory: web
        env:
          VITE_BASENAME: /beta
        run: |
          npm ci
          npm run build

      - name: Add the React app to the site
        working-directory: web
        run: node scripts/assemble.mjs --site ../_site --prefix /beta

      # The pages every operator opens must be there (legacy and beta), with the custom domain.
      - name: Check the site
        run: |
          test "$(cat _site/CNAME)" = "saha.gemcore.com.tr"
          for page in index.html login/index.html machining/index.html machining/tasks/index.html \
                      cnc_cutting/index.html cnc_cutting/tasks/index.html welding/timesheet/index.html \
                      maintenance/index.html maintenance/faults/task/index.html \
                      department-requests/index.html department-requests/create/index.html \
                      beta/index.html beta/login/index.html beta/machining/tasks/index.html \
                      beta/cnc_cutting/tasks/index.html beta/welding/timesheet/index.html \
                      beta/maintenance/faults/task/index.html beta/department-requests/create/index.html; do
            test -s "_site/$page" || { echo "missing $page"; exit 1; }
          done
          # The legacy pages are still the legacy files, not the app.
          if grep -q 'app-assets' _site/machining/index.html; then echo "legacy page replaced"; exit 1; fi
          grep -q 'app-assets' _site/beta/machining/index.html
          test ! -e _site/web
          echo "files: $(find _site -type f | wc -l)"

      # Recent deploys' asset files stay published (see web/scripts/keep-old-assets.mjs).
      - name: Restore earlier deploys' assets
        uses: actions/cache/restore@v4
        with:
          path: .asset-history
          key: app-assets-history-${{ github.run_id }}
          restore-keys: app-assets-history-
      - name: Keep recent asset files
        working-directory: web
        run: node scripts/keep-old-assets.mjs --site ../_site --history ../.asset-history --days 14 --live https://saha.gemcore.com.tr
      - name: Save the assets history
        uses: actions/cache/save@v4
        with:
          path: .asset-history
          key: app-assets-history-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
